name: Dashboard hotfix validation
on:
  push:
    branches: [fix/dashboard-v1-chatgpt-20261116, fix/dashboard-activity-journal-health-20261116]
  pull_request:
    paths:
      - 'v3_2/src/integrations/**'
      - 'v3_2/src/runners/run_three_system_dashboard.py'
      - 'tools/deploy_dashboard_v1_final.sh'
      - 'tests/test_*dashboard*'
      - 'tests/test_trading_control_center_v1_final.py'
      - '.github/workflows/dashboard-hotfix-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard test tools
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile dashboard modules
        run: |
          python -m py_compile v3_2/src/integrations/three_system_dashboard.py
          python -m py_compile v3_2/src/integrations/trading_control_center_data.py
          python -m py_compile v3_2/src/runners/run_three_system_dashboard.py
      - name: Validate deployment shell syntax
        run: bash -n tools/deploy_dashboard_v1_final.sh
      - name: Run dashboard integration tests
        run: |
          python -m pytest -q tests/test_dashboard_observability_001.py tests/test_trading_control_center_v1_final.py tests/test_chatgpt_dashboard_hotfix.py tests/test_dashboard_activity_20261116.py

      - name: Read-only live Dashboard API probe (diagnostic; not CI gate)
        if: always()
        run: |
          python - <<'PY'
          import json, urllib.request, collections
          base = "http://150.241.98.70:8085"
          def read(path):
              with urllib.request.urlopen(base + path,timeout=8) as resp:
                  data=resp.read(2000000)
                  print("HTTP",path,resp.status,"bytes",len(data))
                  return data
          try:
              html=read("/").decode("utf-8","replace")
              for needle in ("Фактический прогресс рыночных циклов","Последнее суточное решение R2","BAR_PROCESSED"):
                  print("LIVE_HTML_HAS",repr(needle),needle in html)
              data=json.loads(read("/api/journal?limit=120"))
              print("LIVE_JOURNAL_EVENTS",data.get("total_events"),len(data.get("events",[])))
              print("LIVE_JOURNAL_SOURCES",json.dumps(data.get("source_status",{}),ensure_ascii=False))
              print("LIVE_EVENT_KINDS",dict(collections.Counter(e.get("event_type") for e in data.get("events",[]))))
              health=json.loads(read("/api/health"))
              print("LIVE_HEALTH_ACTIVITY",json.dumps(health.get("market_activity","MISSING"),ensure_ascii=False))
              analytics=json.loads(read("/api/analytics"))
              from datetime import datetime
              points=(analytics.get("r2") or analytics.get("r2_shadow") or {}).get("equity_history",[])
              parsed=[datetime.fromisoformat(p["timestamp_utc"].replace("Z","+00:00")) for p in points]
              print("LIVE_R2_POINTS",len(points))
              print("LIVE_R2_TIMESTAMPS",[(p["timestamp_utc"],p.get("equity")) for p in points[:30]])
              print("LIVE_R2_INTERVAL_SECONDS",[round((b-a).total_seconds(),2) for a,b in zip(parsed,parsed[1:])][:30])
          except Exception as e:
              print("LIVE_PROBE_UNAVAILABLE",type(e).__name__,str(e)[:200])
          PY
