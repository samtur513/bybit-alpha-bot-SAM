name: R2 resource gate approved recovery
on:
  push:
    branches: [fix/r2-remove-cpu-load-kill-20261116]
  pull_request:
    paths:
      - vendor/cryptolab_r2/research/hunter001_dg001/r2_shadow/readiness.py
      - vendor/cryptolab_r2/research/hunter001_dg001/r2_shadow/RECOVERY_PATCH.json
      - tools/r2_resource_observer.py
      - tests/test_r2_remove_cpu_gate.py
      - tools/deploy_r2_load_gate_recovery.sh
      - .github/workflows/r2-load-gate-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Print exact recovery SHA256
        run: |
          sha256sum vendor/cryptolab_r2/research/hunter001_dg001/r2_shadow/readiness.py
          sha256sum vendor/cryptolab_r2/research/hunter001_dg001/r2_shadow/RECOVERY_PATCH.json
      - name: Validate Python and deployment script syntax
        run: |
          python -m py_compile vendor/cryptolab_r2/research/hunter001_dg001/r2_shadow/readiness.py
          python -m py_compile tools/r2_resource_observer.py
          if [ -f tools/deploy_r2_load_gate_recovery.sh ]; then bash -n tools/deploy_r2_load_gate_recovery.sh; fi
      - name: R2 six hard resource gates and CPU advisory
        run: python -m pytest -q tests/test_r2_remove_cpu_gate.py
