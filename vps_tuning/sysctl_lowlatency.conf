# /etc/sysctl.d/99-bybit-lowlatency.conf
# Оптимизация сетевого стека Linux под HFT / Bybit V5 Low-Latency WebSocket API

# 1. Поддержка VPN и маршрутизации пакетов (КРИТИЧНО: не ломает VPN-сервер)
net.ipv4.ip_forward = 1

# 2. Отключение задержки подтверждений TCP и алгоритма Нейгла
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_timestamps = 1

# 3. Быстрая очистка сокетов и расширение очередей сетевой карты
net.core.netdev_max_backlog = 30000
net.core.somaxconn = 4096
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# 4. Динамические буферы TCP (min, default, max) до 16 МБ для L2 orderbook bursts
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# 5. Запрет сброса окна TCP после простоя (КРИТИЧНО для мгновенных заявок Trade WS)
net.ipv4.tcp_slow_start_after_idle = 0

# 6. Быстрое освобождение TIME_WAIT сокетов и сокращение FIN тайм-аута
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
